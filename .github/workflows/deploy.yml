# Auto-deploy: every push to main rebuilds the container from this repo's
# code and deploys it to the existing Cloud Run service. Keyless login via
# Workload Identity Federation (set up once with setup-autodeploy.sh) - no
# service-account key is stored anywhere. Existing env vars and secrets on
# the service are kept as they are; only the code changes.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'setup-autodeploy.sh'
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/494996217030/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deployer@gen-lang-client-0984437242.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        run: |
          gcloud run deploy lawsticker-backend \
            --source . \
            --region europe-west1 \
            --project gen-lang-client-0984437242 \
            --allow-unauthenticated \
            --quiet

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://lawsticker-backend-494996217030.europe-west1.run.app/api/metal-direction)
          echo "metal-direction HTTP $code"
          test "$code" = "200"
